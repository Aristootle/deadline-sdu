<!-- ============================================================
     SHORT ARTICLE TEMPLATE  |  100–400 words  |  NO IMAGE
     Single-column body, no drop cap
     ============================================================
     HOW TO USE:
     1. Copy into editions/[vol-no]/articles/ and rename
     2. Fill in every [PLACEHOLDER]
     3. Add the filename to edition.json under the right section

     Short articles work well for:
     - Event announcements and notices
     - Brief results or score updates
     - Single-fact news items
     - Follow-ups to larger stories
     ============================================================ -->

<article class="article article--short">

  <h2 class="article-headline">[Headline — aim for 4–8 words, direct]</h2>

  <p class="article-byline">
    [Author Name or Desk e.g. "News Desk"] <span>&middot;</span> Vol. [X], No. [Y]
  </p>

  <div class="article-body">
    <!-- 1–3 paragraphs maximum. Get straight to the point. -->

    <p>[Body text. One to three paragraphs. 100–400 words total. State the essential facts: who, what, when, where. Leave out anything that isn't necessary.]</p>

  </div>

</article>
